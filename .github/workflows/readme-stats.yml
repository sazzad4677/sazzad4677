name: Update README Stats Cards

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 1. Generate the Top Languages Card
      - name: Generate Top Languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # Customize options here (e.g., layout=compact, theme=dark)
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6" 
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 2. Generate the Main Stats Card (Optional, if you use it)
      - name: Generate Main Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true"
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      # 3. Commit and push the generated SVGs back to the repo
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          # Only commit if there are changes to avoid workflow errors
          git commit -m "chore: update README stats cards" || exit 0
          git push
